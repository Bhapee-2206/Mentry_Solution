<style>:root{
  /* Palette sampled directly from the Mentry logo */
  --navy:#0A244D;      /* "M" body + "Mentry" wordmark */
  --blue:#0A58AE;      /* "Solutions" + centre figure */
  --blue-600:#084a93;
  --sky:#1299E8;       /* light end of the swoosh */
  --ink:#1B2333;       /* dark charcoal (tagline text) */
  --muted:#5B6678;
  --mist:#F4F6FA;      /* light gray */
  --mist-2:#EAEFF6;
  --line:#DCE3EE;
  --white:#fff;
  --ok:#0F7B4F;--ok-bg:#E4F4EC;
  --warn:#8A5300;--warn-bg:#FFF1CF;
  --bad:#B42318;--bad-bg:#FDECEA;
  --closed:#4B5565;--closed-bg:#E7EAF0;
  --r-sm:8px;--r-md:14px;--r-lg:22px;
  --shadow:0 1px 2px rgba(10,36,77,.06),0 10px 28px -14px rgba(10,36,77,.22);
  --shadow-lg:0 2px 4px rgba(10,36,77,.06),0 24px 48px -20px rgba(10,36,77,.35);
  --font-d:'Outfit',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;height:100%}
body{font-family:var(--font-b);color:var(--ink);background:var(--white);line-height:1.55;font-size:16px;min-height:100%;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(88px + env(safe-area-inset-top,0px))}
h1,h2,h3,h4{font-family:var(--font-d);color:var(--navy);line-height:1.12;font-weight:650;letter-spacing:-.01em}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
.narrow{max-width:820px}
.muted{color:var(--muted)}
.tc{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.grow{flex:1}
.hide{display:none!important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-family:var(--font-d);font-weight:600;font-size:.98rem;letter-spacing:.005em;transition:background .15s,border-color .15s,transform .05s,box-shadow .15s;text-decoration:none!important;white-space:nowrap;background:none;color:var(--navy)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 16px -8px rgba(10,88,174,.7)}
.btn-primary:hover{background:var(--blue-600)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:#06183a}
.btn-outline{border-color:var(--navy);color:var(--navy);background:#fff}
.btn-outline:hover{background:var(--mist)}
.btn-soft{background:var(--mist-2);color:var(--navy)}
.btn-soft:hover{background:#dde6f2}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-danger:hover{background:#f9d7d2}
.btn-ok{background:var(--ok-bg);color:var(--ok)}
.btn-sm{min-height:36px;padding:0 14px;font-size:.88rem;border-radius:10px}
.btn-lg{min-height:54px;padding:0 28px;font-size:1.05rem;border-radius:14px}
.btn-block{width:100%}
.btn[disabled],.btn.disabled{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;border:1.5px solid var(--line);background:#fff;color:var(--navy)}
.icon-btn:hover{background:var(--mist)}
.icon-btn.on{background:var(--mist-2);border-color:var(--blue);color:var(--blue)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--mist-2);color:var(--navy);white-space:nowrap}
.badge.verified{background:var(--ok-bg);color:var(--ok)}
.badge.open{background:var(--ok-bg);color:var(--ok)}
.badge.closing{background:var(--warn-bg);color:var(--warn)}
.badge.closed,.badge.rejected,.badge.suspended{background:var(--closed-bg);color:var(--closed)}
.badge.pending{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.blue{background:#E1EEFB;color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:78px}
.logo img{height:60px;width:auto}
.nav{display:flex;gap:6px;flex:1}
.nav a{padding:8px 14px;border-radius:10px;color:var(--ink);font-weight:550;font-family:var(--font-d);font-size:.97rem;text-decoration:none}
.nav a:hover{background:var(--mist)}
.nav a.on{color:var(--blue);background:#E9F1FB}
.hdr-cta{display:flex;gap:10px;align-items:center}
.burger{display:none}
.mobile-cta{display:none}
@media(max-width:920px){
  .nav,.hdr-cta{display:none}
  .burger{display:inline-grid}
  .mobile-cta{display:inline-flex}
  .hdr .wrap{height:64px;gap:10px}
  .logo img{height:50px}
  .hdr .wrap{justify-content:space-between}
}
.drawer{position:fixed;inset:0;z-index:90;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(6,24,58,.5)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(340px,88vw);background:#fff;padding:20px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-lg);overflow:auto}
.drawer .panel a.item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;color:var(--ink);font-family:var(--font-d);font-weight:550;text-decoration:none}
.drawer .panel a.item:hover{background:var(--mist)}

/* mobile bottom nav */
.bnav{display:none}
@media(max-width:920px){
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -16px rgba(10,36,77,.3)}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:6px 2px;border:0;background:none;text-decoration:none;font-family:var(--font-b)}
  .bnav svg{width:22px;height:22px}
  .bnav .on{color:var(--blue)}
  body.has-bnav main{padding-bottom:78px}
  body.no-bnav .bnav{display:none}
}

/* ---------- sections ---------- */
section.s{padding:84px 0}
section.s.tight{padding:56px 0}
.s-mist{background:var(--mist)}
.s-navy{background:var(--navy);color:#fff}
.s-navy h2,.s-navy h3{color:#fff}
.h2{font-size:clamp(1.9rem,4vw,2.9rem);text-transform:uppercase;letter-spacing:-.005em}
.lead{font-size:1.15rem;color:var(--muted);max-width:60ch}
.s-navy .lead{color:#C4D3EA}
.sec-head{margin-bottom:40px;max-width:760px}
.sec-head.c{margin-left:auto;margin-right:auto;text-align:center}
.sec-head.c .lead{margin-left:auto;margin-right:auto}
@media(max-width:700px){section.s{padding:56px 0}}

/* ---------- hero ---------- */
.hero{padding:56px 0 72px;background:linear-gradient(180deg,#fff 0%,#fff 60%,var(--mist) 100%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.7rem,6.2vw,5rem);text-transform:uppercase;font-weight:700;letter-spacing:-.02em;line-height:1.02}
.hero p.lead{margin:22px 0 30px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .fine{margin-top:16px;display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:550;font-size:.95rem}
.hero .fine svg{color:var(--ok)}
.stage{position:relative;background:var(--mist-2);border-radius:28px;padding:22px;overflow:hidden}
.noise{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.noise .msg{align-self:flex-start;max-width:86%;background:#fff;color:#8a94a6;border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:.84rem;opacity:.75}
.noise .msg small{display:block;font-size:.7rem;color:#a4adbc}
.noise .msg:nth-child(2){align-self:flex-end;border-radius:14px 4px 14px 14px;opacity:.6}
.noise .msg:nth-child(3){opacity:.45}
.stage .sort{display:flex;align-items:center;gap:8px;margin:12px 4px;color:var(--blue);font-weight:650;font-family:var(--font-d);font-size:.9rem}
.stage .sort:before,.stage .sort:after{content:"";height:1.5px;background:var(--blue);opacity:.35;flex:1}
@media(max-width:920px){.hero .wrap{grid-template-columns:1fr;gap:36px}.hero{padding:32px 0 48px}}

/* ---------- flow diagrams ---------- */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;justify-content:center}
.node{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;font-family:var(--font-d);font-weight:600;color:var(--navy);min-width:150px;text-align:center}
.node.dim{color:var(--muted);background:var(--mist);border-style:dashed}
.node.hl{background:var(--blue);color:#fff;border-color:var(--blue)}
.arrow{display:grid;place-items:center;width:38px;color:var(--muted)}
@media(max-width:820px){.flow{flex-direction:column;align-items:center}.arrow{width:auto;height:34px;transform:rotate(90deg)}}
.pain{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:36px}
.pain div{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:550}
.pain svg{color:var(--bad);margin-top:4px}
.way{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.way-diagram{display:flex;flex-direction:column;align-items:center;gap:6px}
.way-diagram .node{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.25);width:min(320px,100%);font-size:1.05rem}
.way-diagram .node.hl{background:#fff;color:var(--navy);border-color:#fff;padding:18px}
.way-diagram .node.hl img{height:74px;margin:0 auto 6px}
.way-diagram .v{color:var(--sky);height:34px;display:grid;place-items:center}
@media(max-width:820px){.way{grid-template-columns:1fr;gap:32px}}

/* ---------- grids/cards ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:920px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:22px;box-shadow:var(--shadow)}
.step{padding:26px}
.step .n{font-family:var(--font-d);font-size:2.6rem;font-weight:700;color:var(--sky);line-height:1;margin-bottom:12px}
.step h3{font-size:1.3rem;margin-bottom:6px}
.callout{display:inline-flex;gap:8px;align-items:center;background:var(--ok-bg);color:var(--ok);font-weight:700;padding:8px 14px;border-radius:99px;font-family:var(--font-d)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.cats{grid-template-columns:repeat(2,1fr)}}
.cat{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;font-family:var(--font-d);font-weight:600;color:var(--navy);text-decoration:none!important;transition:border-color .15s,box-shadow .15s}
.cat:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.cat .e{font-size:1.6rem}
.cat small{font-family:var(--font-b);font-weight:500;color:var(--muted)}
.feat{display:flex;gap:16px}
.feat .ico{width:48px;height:48px;border-radius:14px;background:#E1EEFB;color:var(--blue);display:grid;place-items:center;font-size:1.3rem;flex:none}
.feat h3{font-size:1.15rem;margin-bottom:4px}
.tick{list-style:none;padding:0;display:grid;gap:10px}
.tick li{display:flex;gap:10px;align-items:flex-start;font-weight:550}
.tick svg{color:var(--ok);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;overflow:hidden}
.stats div{padding:26px 20px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--font-d);font-size:2.3rem;color:var(--navy);line-height:1}
.stats span{color:var(--muted);font-weight:550}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.cta-band{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:44px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{color:#fff;font-size:clamp(1.6rem,3vw,2.3rem);max-width:22ch}
.cta-band .btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.cta-band .btn-outline:hover{background:rgba(255,255,255,.1)}

/* ---------- opportunity feed ---------- */
.page-head{padding:36px 0 22px;background:var(--mist);border-bottom:1px solid var(--line)}
.page-head h1{font-size:clamp(1.8rem,4vw,2.6rem);text-transform:uppercase}
.searchbox{position:relative;margin-top:18px}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.1rem}
.searchbox input{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--line);padding:0 16px 0 46px;font:inherit;background:#fff;box-shadow:var(--shadow)}
.searchbox input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(18,153,232,.18)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:7px 15px;font-weight:600;font-size:.9rem;font-family:var(--font-b)}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.urgent.on{background:var(--bad);border-color:var(--bad)}
.feed-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding:26px 0 60px;align-items:start}
.filters{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:18px;display:grid;gap:14px}
.filters h3{font-size:1rem}
.filters label{font-weight:600;font-size:.86rem;color:var(--muted);display:block;margin-bottom:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:.92rem;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--blue)}
.filter-toggle{display:none}
@media(max-width:920px){
  .feed-layout{grid-template-columns:1fr;padding-top:14px}
  .filters{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:80;border-radius:22px 22px 0 0;max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .25s;box-shadow:var(--shadow-lg);padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .filters.open{transform:none}
  .filter-toggle{display:inline-flex}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.feed{display:grid;gap:16px}
.dsep{display:flex;justify-content:center;margin:10px 0 0}
.dsep span{background:var(--mist-2);color:var(--muted);font-weight:650;font-size:.78rem;padding:4px 12px;border-radius:99px;font-family:var(--font-d)}
.opp{background:#fff;border:1px solid var(--line);border-radius:6px 20px 20px 20px;box-shadow:var(--shadow);max-width:760px;overflow:hidden;position:relative}
.opp.urgent{border-color:#F0B6AE}
.opp.closed{opacity:.72}
.opp-head{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-weight:650;font-size:.9rem;flex:none}
.opp-head .who{min-width:0;flex:1}
.opp-head .who strong{display:block;font-family:var(--font-d);font-size:.95rem;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp-head time{font-size:.78rem;color:var(--muted);white-space:nowrap}
.opp-body{padding:12px 18px 6px}
.kick{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.kick.u{color:var(--bad)}
.opp h3{font-size:1.4rem;margin-bottom:12px}
.opp h3 a{color:inherit;text-decoration:none}
.facts{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-weight:550;font-size:.95rem}
.facts li{display:flex;gap:8px;align-items:center}
.facts svg{color:var(--blue)}
.perks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.perk{display:inline-flex;gap:6px;align-items:center;background:var(--mist);border-radius:99px;padding:4px 11px;font-size:.84rem;font-weight:550;color:var(--ink)}
.perk svg{color:var(--blue)}
.more{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:.93rem}
.more.open{display:block}
.more h4{font-size:.85rem;color:var(--muted);margin:10px 0 6px;font-family:var(--font-b);font-weight:700}
.opp-foot{display:flex;gap:8px;align-items:center;padding:12px 18px 16px;flex-wrap:wrap}
.opp-foot .sp{flex:1}
@media(max-width:600px){.facts{grid-template-columns:1fr}.opp-foot .btn{flex:1}.opp-foot .sp{display:none}.opp h3{font-size:1.25rem}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:#E1EEFB;color:var(--blue);font-weight:600;font-size:.84rem;padding:4px 10px;border-radius:8px}
.loadmore{display:flex;justify-content:center;margin-top:6px}

/* ---------- detail ---------- */
.crumbs{font-size:.9rem;color:var(--muted);padding:20px 0 6px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;padding:10px 0 60px;align-items:start}
.detail-main h1{font-size:clamp(1.9rem,4vw,2.8rem);margin:14px 0 8px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin:22px 0}
.kv div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-right:-1px;margin-bottom:-1px}
.kv small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.kv b{font-family:var(--font-d);color:var(--navy);font-size:1.02rem}
@media(max-width:820px){.kv{grid-template-columns:repeat(2,1fr)}}
.dsec{margin:26px 0}
.dsec h2{font-size:1.15rem;margin-bottom:10px}
.tfa{display:grid;gap:8px}
.tfa div{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--mist);font-weight:550}
.tfa .yes svg{color:var(--ok)}.tfa .no{color:var(--muted)}
.side{position:sticky;top:96px;display:grid;gap:14px}
.notice{padding:12px 16px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.info{background:#E1EEFB;color:var(--blue)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.stickybar{display:none}
@media(max-width:920px){
  .detail{grid-template-columns:1fr}
  .side{position:static}
  .side .apply-actions{display:none}
  .stickybar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 24px -16px rgba(10,36,77,.35)}
  .stickybar .btn{flex:1}
  body.has-sticky main{padding-bottom:90px}
}

/* ---------- forms ---------- */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:650;font-size:.92rem;color:var(--ink)}
.field .hint{font-size:.82rem;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;background:#fff;color:var(--ink)}
.textarea{min-height:100px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(18,153,232,.18)}
.field.err .input,.field.err .select,.field.err .textarea,.field.err .drop{border-color:var(--bad)}
.field .msg{color:var(--bad);font-size:.85rem;font-weight:600;display:none}
.field.err .msg{display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.frow{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:550;margin:6px 0 18px}
.check input{width:20px;height:20px;accent-color:var(--blue);margin-top:2px;flex:none}
.drop{border:2px dashed #B7C6DC;border-radius:14px;padding:22px;text-align:center;background:var(--mist);cursor:pointer;display:grid;gap:4px;place-items:center;color:var(--muted);font-weight:550}
.drop:hover{border-color:var(--blue);background:#EEF4FC}
.drop svg{font-size:1.6rem;color:var(--blue)}
.filechip{display:flex;align-items:center;gap:10px;background:#E1EEFB;border-radius:12px;padding:10px 14px;font-weight:600;color:var(--navy)}
.filechip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.summary{background:var(--mist);border-radius:var(--r-md);padding:16px 18px;display:grid;gap:4px;margin-bottom:22px}
.summary b{font-family:var(--font-d);font-size:1.15rem;color:var(--navy)}
.summary .row{color:var(--muted);font-weight:550;gap:14px;flex-wrap:wrap}
.form-card{max-width:640px;margin:0 auto}
.auth{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:40px 20px;background:var(--mist)}
.auth .card{width:min(460px,100%);padding:32px}
.auth img.lg{height:96px;margin:0 auto 14px}
.demo{background:#E1EEFB;color:var(--navy);border-radius:12px;padding:12px 14px;font-size:.88rem;margin-top:16px}
.demo code{background:#fff;padding:1px 6px;border-radius:6px;font-size:.85rem}
.sticky-submit{}
@media(max-width:640px){.sticky-submit{position:sticky;bottom:0;background:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin:0 -4px;z-index:5}}
.success{text-align:center;padding:64px 0}
.success .ring{width:88px;height:88px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 18px;font-size:2.4rem}
.appid{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:1.6rem;font-weight:700;color:var(--navy);background:var(--mist);border:1.5px dashed #B7C6DC;padding:10px 20px;border-radius:14px;margin:10px 0 18px}

/* ---------- footer ---------- */
.ftr{background:var(--navy);color:#C4D3EA;padding:56px 0 30px;margin-top:0}
.ftr .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.ftr .chipl{background:#fff;border-radius:16px;padding:12px 16px;display:inline-block}
.ftr .chipl img{height:88px;width:auto}
.ftr h4{color:#fff;font-size:.95rem;margin-bottom:10px;font-family:var(--font-d)}
.ftr a{color:#C4D3EA;display:block;padding:4px 0;text-decoration:none}
.ftr a:hover{color:#fff;text-decoration:underline}
.ftr .bot{border-top:1px solid rgba(255,255,255,.15);margin-top:36px;padding-top:20px;font-size:.88rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:820px){.ftr .cols{grid-template-columns:1fr 1fr}.ftr .cols>div:first-child{grid-column:1/-1}}

/* ---------- panel layouts (vendor/admin) ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;background:var(--mist)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar .logo{padding:2px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px;display:block}
.sidebar .logo img{height:64px}
.sidebar .tag{background:none;color:var(--muted);padding:6px 10px 2px;font-size:.72rem;font-weight:700;letter-spacing:.02em}
.sidebar a.item,.sidebar button.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink);font-weight:600;font-family:var(--font-d);font-size:.95rem;text-decoration:none;border:0;background:none;text-align:left;width:100%}
.sidebar a.item:hover,.sidebar button.item:hover{background:var(--mist)}
.sidebar a.item.on{background:#E1EEFB;color:var(--blue)}
.sidebar .count{margin-left:auto;background:var(--blue);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 8px}
.pmain{padding:26px 30px 60px;min-width:0}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.ptop h1{font-size:1.8rem}
.mtop{display:none}
@media(max-width:920px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:95;left:0;top:0;bottom:0;width:270px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;position:sticky;top:0;z-index:40}
  .mtop img{height:46px}
  .pmain{padding:18px 16px 60px}
}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow)}
.metric small{color:var(--muted);font-weight:650;display:block;margin-bottom:6px}
.metric b{font-family:var(--font-d);font-size:2.1rem;color:var(--navy);line-height:1}
.metric.acc{background:var(--navy);border-color:var(--navy)}
.metric.acc small{color:#B9CBE6}.metric.acc b{color:#fff}
.panel-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.panel-card>header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.panel-card>header h2{font-size:1.1rem}
.panel-card .pad{padding:20px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:700;padding:10px 16px;background:var(--mist);white-space:nowrap}
.tbl td{padding:13px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#FAFBFD}
.tbl .acts{display:flex;gap:6px;flex-wrap:wrap}
.tscroll{overflow-x:auto}
.tbl td b{color:var(--navy)}
.tbl small{color:var(--muted);display:block}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:2.4rem;margin-bottom:6px}
.empty h3{color:var(--navy);margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{border-radius:var(--r-md);padding:14px 18px;margin-bottom:20px;display:flex;gap:12px;align-items:flex-start;font-weight:550}
.banner.pending{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}

/* inbox */
.inbox{display:grid;grid-template-columns:380px minmax(0,1fr);gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-height:600px;box-shadow:var(--shadow)}
.inbox-list{border-right:1px solid var(--line);max-height:76vh;overflow:auto}
.inbox-group{background:var(--mist);padding:8px 16px;font-family:var(--font-d);font-weight:650;font-size:.84rem;color:var(--navy);position:sticky;top:0;z-index:1;display:flex;justify-content:space-between}
.thread{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none!important;color:var(--ink);align-items:flex-start}
.thread:hover{background:#F7F9FC}
.thread.on{background:#E9F1FB;box-shadow:inset 3px 0 0 var(--blue)}
.thread .av{width:42px;height:42px;border-radius:50%;background:var(--mist-2);color:var(--navy);display:grid;place-items:center;font-family:var(--font-d);font-weight:650;flex:none}
.thread .t{min-width:0;flex:1}
.thread .t b{display:flex;justify-content:space-between;gap:8px;color:var(--navy)}
.thread .t small{color:var(--muted);font-weight:500}
.thread .t .sub{font-size:.86rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.newdot{width:9px;height:9px;border-radius:50%;background:var(--blue);display:inline-block}
.inbox-detail{padding:26px}
.inbox-detail .bubble{background:var(--mist);border-radius:4px 16px 16px 16px;padding:14px 16px;margin:16px 0;max-width:560px}
.dc{display:inline-flex;align-items:center;gap:8px;background:var(--ok-bg);color:var(--ok);font-weight:650;border-radius:12px;padding:8px 12px;font-size:.88rem;margin-bottom:14px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin:18px 0}
.dgrid small{display:block;color:var(--muted);font-weight:650;font-size:.78rem}
.dgrid b{font-weight:600;word-break:break-word}
@media(max-width:920px){
  .inbox{grid-template-columns:1fr}
  .inbox.detail-open .inbox-list{display:none}
  .inbox:not(.detail-open) .inbox-detail{display:none}
  .inbox-list{max-height:none}
  .dgrid{grid-template-columns:1fr}
}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(6,24,58,.55)}
.modal .box{position:relative;background:#fff;border-radius:20px;padding:26px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal .box h2{font-size:1.4rem;margin-bottom:14px;padding-right:30px}
.modal .x{position:absolute;right:14px;top:14px}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:200;display:grid;gap:8px;max-width:min(380px,calc(100vw - 32px))}
@media(max-width:920px){.toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:none}}
.toast{background:var(--navy);color:#fff;padding:13px 16px;border-radius:14px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center}
.toast.ok svg{color:#7EE0B0}.toast.err{background:var(--bad)}
.errbox{text-align:center;padding:60px 20px}

/* skeleton */
.sk{background:linear-gradient(90deg,#E9EEF6 25%,#F5F8FC 37%,#E9EEF6 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-card{background:#fff;border:1px solid var(--line);border-radius:6px 20px 20px 20px;padding:18px;max-width:760px;display:grid;gap:12px}

/* misc */
.legal h2{font-size:1.25rem;margin:26px 0 8px}
.legal p,.legal li{color:#3a4557;margin-bottom:8px}
.pill-nav{display:flex;gap:8px;flex-wrap:wrap}
pre.mail{background:var(--mist);border-radius:12px;padding:14px;white-space:pre-wrap;font:.84rem/1.5 ui-monospace,Menlo,monospace;overflow:auto;max-height:340px}

.filters label.switch{display:flex;color:var(--ink);font-size:.92rem;margin:0}
.only-m{display:none!important}
@media(max-width:920px){.only-m{display:inline-flex!important}}
</style>

const DAY = 864e5, HOUR = 36e5;
const NOW = Date.now();

const fmtDate = ts => new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

/* ---------------- Blob storage (resumes; swap for private S3/GCS bucket) ---------------- */
const Blobs = {
  mem: new Map(), db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('mentry-files', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async put(key, blob) {
    this.mem.set(key, blob);
    try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch { return this.mem.has(key); }
  },
  async get(key) {
    if (this.mem.has(key)) return this.mem.get(key);
    try { const db = await this.open(); return await new Promise((res, rej) => { const rq = db.transaction('files').objectStore('files').get(key); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error); }); } catch { return null; }
  }
};

/* ---------------- Validation (mirrors server-side rules) ---------------- */
const MAX_FILE = 8 * 1024 * 1024;
const V = {
  name: s => /^[\p{L}][\p{L} .'-]{1,59}$/u.test(String(s).trim()) ? '' : 'Enter your full name (letters only).',
  phone: s => { const d = String(s).replace(/[\s\-()]/g, '').replace(/^(\+?91|0)/, ''); return /^[6-9]\d{9}$/.test(d) ? '' : 'Enter a valid 10-digit Indian mobile number.'; },
  email: s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s).trim()) ? '' : 'Enter a valid email address.',
  req: (s, m = 'This field is required.') => String(s ?? '').trim() ? '' : m,
  fileBasic(f) {
    if (!f) return 'Upload your resume (PDF, DOC or DOCX).';
    if (!/\.(pdf|docx?)$/i.test(f.name)) return 'Resume must be a PDF, DOC or DOCX file.';
    if (f.size > MAX_FILE) return 'Resume must be smaller than 8 MB.';
    if (f.size < 500) return 'This file looks empty. Please choose your resume.';
    return '';
  },
  async fileSignature(f) {
    const b = new Uint8Array(await f.slice(0, 8).arrayBuffer());
    const hex = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
    const ext = f.name.split('.').pop().toLowerCase();
    if (ext === 'pdf') return hex.startsWith('25504446') ? '' : 'bad';
    if (ext === 'docx') return hex.startsWith('504b0304') ? '' : 'bad';
    if (ext === 'doc') return (hex.startsWith('d0cf11e0') || hex.startsWith('504b0304')) ? '' : 'bad';
    return 'bad';
  }
};

/* ---------------- helpers on requirements ---------------- */
function reqStatus(r) {
  if (r.state === 'pending') return 'pending';
  if (r.state === 'rejected') return 'rejected';
  if (r.state === 'closed' || NOW > r.deadline) return 'closed';
  return (r.deadline - NOW) < 3 * DAY ? 'closing' : 'open';
}
const STATUS_TXT = { open: 'Open', closing: 'Closing soon', closed: 'Closed', pending: 'Pending Mentry review', rejected: 'Rejected' };
const vendorOf = id => DB.d.vendors.find(v => v.id === id);
const catOf = id => DB.d.categories.find(c => c.id === id) || { label: 'Other', icon: '✨', group: 'other' };
const isPublic = r => r.state !== 'pending' && r.state !== 'rejected' && vendorOf(r.vendorId)?.status === 'verified';
function pubReq(r) {
  const v = vendorOf(r.vendorId);
  return Object.assign({}, r, { status: reqStatus(r), vendor: { id: v.id, company: v.company, verified: v.status === 'verified', initials: v.logoText }, cat: catOf(r.category), commercial: r.commercial.visible ? r.commercial : { text: '', visible: false } });
}
function tfaAll(r) { return r.travel.ok && r.food.ok && r.stay.ok; }
function filterReqs(list, f) {
  const q = (f.q || '').toLowerCase().trim();
  return list.filter(r => {
    if (!f.closed && r.status === 'closed') return false;
    if (f.group === 'urgent' && !r.urgent) return false;
    if (f.group && f.group !== 'all' && f.group !== 'urgent' && r.cat.group !== f.group) return false;
    if (f.cat && r.category !== f.cat) return false;
    if (f.loc && locKey(r.location) !== locKey(f.loc)) return false;
    if (f.exp !== undefined && f.exp !== '' && r.expMin > +f.exp) return false;
    if (f.mode && r.mode !== f.mode) return false;
    if (f.tfa && !tfaAll(r)) return false;
    if (f.remote && r.mode === 'Onsite') return false;
    if (f.from && r.start < new Date(f.from).getTime()) return false;
    if (f.avail === 'now' && r.start - NOW > 7 * DAY) return false;
    if (f.avail === '2w' && r.start - NOW > 14 * DAY) return false;
    if (f.avail === 'later' && r.start - NOW <= 14 * DAY) return false;
    if (q) { const hay = [r.title, r.location, r.vendor.company, r.cat.label, r.audience, ...r.topics, ...r.skills].join(' ').toLowerCase(); if (!q.split(/\s+/).every(w => hay.includes(w))) return false; }
    return true;
  });
}

/* ---------- router ---------- */
const ROUTES = [];
function route(path, opts, handler) {
  const keys = [];
  const re = new RegExp('^' + path.replace(/:([a-z]+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '/?$');
  ROUTES.push({ re, keys, opts, handler });
}
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1) || '/'); const [path, qs] = h.split('?');
  return { path: path || '/', q: new URLSearchParams(qs || '') };
}
const go = p => { if (location.hash === '#' + p) render(); else location.hash = p; };
const CTX = { path: '/', q: new URLSearchParams() };
let renderToken = 0;

async function render(o = {}) {
  const token = ++renderToken;
  const { path, q } = parseHash(); CTX.path = path; CTX.q = q;
  const m = ROUTES.map(r => ({ r, mm: path.match(r.re) })).find(x => x.mm);
  const ses = Session.get();
  const scrollY = window.scrollY;
  closeDrawer(); closeModal();
  if (!m) { paint('pub', notFound(), path, {}); setSEO({ title: 'Page not found — Mentry Solutions', desc: '', path }); return; }
  const { r, mm } = m; const params = {}; r.keys.forEach((k, i) => params[k] = mm[i + 1]);
  if (r.opts.auth) {
    if (!ses || ses.role !== r.opts.auth) { go(r.opts.auth === 'admin' ? '/admin/login' : '/vendor/login?next=' + encodeURIComponent(path)); return; }
    if (r.opts.auth === 'vendor' && vendorOf(ses.vendorId)?.status === 'suspended') { Session.clear(); go('/vendor/login'); return; }
  }
  if (r.opts.guest && ses && ses.role === r.opts.guest) { go(r.opts.guest === 'admin' ? '/admin/dashboard' : '/vendor/dashboard'); return; }
  const ctx = { params, q, path, ses, mount: null, active: r.opts.active || path };
  if (r.opts.skel && !o.quiet) { paint(r.opts.layout, SK[r.opts.skel](), path, ctx); await sleep(260); if (token !== renderToken) return; }
  let html;
  try { html = await r.handler(ctx); } catch (e) { console.error(e); html = errorState('Something went wrong while loading this page.'); }
  if (token !== renderToken) return;
  paint(r.opts.layout, html, path, ctx, r.opts.body);
  if (ctx.seo) setSEO(ctx.seo);
  if (ctx.mount) ctx.mount();
  window.scrollTo(0, o.keepScroll ? scrollY : 0);
}
function paint(layout, html, path, ctx, bodyMode) {
  document.body.classList.remove('has-bnav', 'no-bnav', 'has-sticky');
  if (layout === 'pub') { document.body.classList.add(bodyMode === 'sticky' ? 'no-bnav' : bodyMode === 'plain' ? 'no-bnav' : 'has-bnav'); if (bodyMode === 'sticky') document.body.classList.add('has-sticky'); }
  $('#root').innerHTML = layout === 'pub' ? pubShell(html, path) : layout === 'vendor' ? vendorShell(html, ctx) : layout === 'admin' ? adminShell(html, ctx) : html;
}
window.addEventListener('hashchange', () => render());

function baseUrl() { return (DB.d.settings.baseUrl || (location.origin + location.pathname)).replace(/\/$/, ''); }
function setSEO({ title, desc, path, type }) {
  document.title = title;
  const set = (sel, attr, val, mk) => { let el = $(sel); if (!el) { el = document.createElement(mk); const [k, v] = attr; el.setAttribute(k, v); document.head.appendChild(el); } el.setAttribute(el.tagName === 'LINK' ? 'href' : 'content', val); };
  const url = baseUrl() + '#' + path;
  set('meta[name=description]', ['name', 'description'], desc || '', 'meta');
  set('meta[property="og:title"]', ['property', 'og:title'], title, 'meta');
  set('meta[property="og:description"]', ['property', 'og:description'], desc || '', 'meta');
  set('meta[property="og:type"]', ['property', 'og:type'], type || 'website', 'meta');

API.changePassword = async (oldP, newP) => {
  const s = Session.get(); const u = DB.d.users.find(x => x.id === s.userId);
  if (u.passHash !== await sha256(oldP)) throw new Error('Current password is incorrect.');
  if (newP.length < 8) throw new Error('Use at least 8 characters for the new password.');
  u.passHash = await sha256(newP); DB.save();
};

const role = () => Session.get()?.role;
const rerender = () => render({ keepScroll: true, quiet: true });
const splitList = s => String(s || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
async function copyText(t) { try { await navigator.clipboard.writeText(t); return true; } catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch { } ta.remove(); return ok; } }
function downloadBlob(blob, name) { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }

const ACT = {
  skip() { $('#main')?.scrollIntoView(); },
  drawer() { $('#drawer')?.classList.add('open'); },
  closeDrawer() { closeDrawer(); },
  sidebar() { $('#sidebar')?.classList.toggle('open'); },
  closeModal() { closeModal(); },
  retry() { render(); },
  confirmYes() { const f = confirmFn; confirmFn = null; closeModal(); f && f(); },
  logout() { Session.clear(); toast('Logged out'); go('/'); },
  group(el) { F.group = el.dataset.v; F.page = 1; refreshFeed(); },
  clearCat() { F.cat = ''; F.page = 1; refreshFeed(); },
  more() { F.page++; refreshFeed(); },
  filters() { $('#filters')?.classList.toggle('open'); },
  resetFilters() { F = { group: 'all', page: 1 }; $('#q') && ($('#q').value = ''); $$('#filters select,#filters input[type=date]').forEach(x => x.value = ''); $$('#filters input[type=checkbox]').forEach(x => x.checked = false); refreshFeed(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  toggleMore(el) { const m = $('#m-' + el.dataset.id); const open = m.classList.toggle('open'); el.setAttribute('aria-expanded', open); el.innerHTML = ic(open ? 'chevD' : 'chevD'); el.style.transform = open ? 'rotate(180deg)' : ''; },
  save(el) { const on = Saved.toggle(el.dataset.id); toast(on ? 'Saved on this device' : 'Removed from saved'); if (CTX.path === '/saved') return rerender(); if (CTX.path.startsWith('/opportunities/')) return rerender(); $$(`[data-act=save][data-id="${el.dataset.id}"]`).forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); },
  share(el) {
    const r = API.publicRequirements().find(x => x.id === el.dataset.id); if (!r) return; const t = waText(r);
    openModal(`<h2>Share this requirement</h2><pre class="mail">${esc(t)}</pre><div class="row wrapx" style="margin-top:14px"><a class="btn btn-ok" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">${ic('chat')} WhatsApp</a><button class="btn btn-soft" data-act="copyLink" data-id="${r.id}">${ic('copy')} Copy link</button><a class="btn btn-soft" href="mailto:?subject=${encodeURIComponent('Trainer requirement: ' + r.title)}&body=${encodeURIComponent(t)}">${ic('mail')} Email</a></div>`);
  },
  async copyLink(el) { const r = API.publicRequirements().find(x => x.id === el.dataset.id); toast(await copyText(shareUrl(r, false)) ? 'Link copied' : 'Could not copy — select and copy manually', 'ok'); },
  async copyId(el) { toast(await copyText(el.dataset.v) ? 'Application ID copied' : 'Could not copy', 'ok'); },
  removeFile() { pendingFile = null; const i = $('#f-file'); if (i) i.value = ''; $('#filechip').innerHTML = ''; $('#drop').classList.remove('hide'); },
  forgot() { openModal(`<h2>Reset password</h2><form data-form="forgot" novalidate>${fld('email', 'Your business email', inp('email', { type: 'email' }))}<button class="btn btn-primary" type="submit">Send reset link</button></form>`); },
  async resume(el) {
    try { const { app, blob } = await API.resume(el.dataset.id); if (!blob) return toast('Sample application — no resume file is stored for demo data.', 'err'); downloadBlob(blob, app.resumeName); toast('Resume downloaded'); }
    catch (e) { toast(e.message, 'err'); }
  },
  async contacted(el) { const a = DB.d.applications.find(x => x.id === el.dataset.id); if (a && a.status === 'Applied') { try { await API.vendorSetApplication(a.id, 'Contacted'); setTimeout(rerender, 300); } catch { } } },
  async appStatus(el) {
    try { const s = el.dataset.s; role() === 'admin' ? await API.adminSetApplication(el.dataset.id, s) : await API.vendorSetApplication(el.dataset.id, s); toast(`Marked ${s.toLowerCase()}`); rerender(); } catch (e) { toast(e.message, 'err'); }
  },
  vClose(el) { askConfirm('Close this requirement?', 'It will stop accepting applications and disappear from active listings.', 'Close requirement', () => { try { API.vendorCloseRequirement(el.dataset.id); toast('Requirement closed'); rerender(); } catch (e) { toast(e.message, 'err'); } }, true); },
  /* admin */
  vView(el) { const v = vendorOf(el.dataset.id); openModal(`<h2>${esc(v.company)}</h2>${vStatusBadge(v.status)}<div class="dgrid"><div><small>Contact</small><b>${esc(v.contact)}</b></div><div><small>Email</small><b>${esc(v.email)}</b></div><div><small>Phone</small><b>${esc(v.phone)}</b></div><div><small>Website</small><b>${esc(v.website || '—')}</b></div><div><small>Location</small><b>${esc(v.location)}</b></div><div><small>Type</small><b>${esc(v.type)} · ${v.years} yrs</b></div><div><small>Training areas</small><b>${esc(v.areas)}</b></div><div><small>Institutions served</small><b>${esc(v.served)}</b></div></div><p>${esc(v.desc)}</p><p class="muted" style="margin-top:8px">Documents: ${v.docs.map(esc).join(', ') || '—'}</p>`); },
  async vSet(el) { try { await API.adminSetVendor(el.dataset.id, el.dataset.s); toast(`Vendor ${el.dataset.s}`); rerender(); } catch (e) { toast(e.message, 'err'); } },
  async rSet(el) {
    const a = el.dataset.a, go_ = async () => { try { await API.adminSetRequirement(el.dataset.id, a); toast(a === 'approve' ? 'Requirement published' : a === 'reject' ? 'Requirement rejected' : 'Requirement closed'); rerender(); } catch (e) { toast(e.message, 'err'); } };
    a === 'close' ? askConfirm('Close requirement?', 'Open applications will be marked closed.', 'Close', go_, true) : go_();
  },
  rDel(el) { askConfirm('Delete requirement?', 'This permanently removes the requirement. Its applications stay in the database.', 'Delete', async () => { await API.adminSetRequirement(el.dataset.id, 'delete'); toast('Requirement deleted'); rerender(); }, true); },
  rEdit(el) {
    const r = DB.d.requirements.find(x => x.id === el.dataset.id);
    openModal(`<h2>Edit requirement</h2><form data-form="redit" data-id="${r.id}" novalidate>${fld('title', 'Title', inp('title', { val: r.title }))}<div class="frow">${fld('location', 'Location', sel('location', CITIES, { val: locLabel(r.location) }))}${fld('vacancies', 'Vacancies', inp('vacancies', { type: 'number', min: 1, val: r.vacancies }))}</div>${fld('deadline', 'Application deadline', inp('deadline', { type: 'date', val: isoLocal(r.deadline) }))}<label class="check"><input type="checkbox" name="urgent" ${r.urgent ? 'checked' : ''}><span>Urgent</span></label><button class="btn btn-primary" type="submit">Save</button></form>`);
  },
  aView(el) { const a = API.adminApplications().find(x => x.id === el.dataset.id); a.vendor = a.vendor; openModal(`<h2>${a.id}</h2>${appDetail(Object.assign({}, a, { req: a.req }), 'admin')}`); },
  tView(el) { const t = API.adminTrainers().find(x => x.id === el.dataset.id); openModal(`<h2>${esc(t.name)}</h2><p class="muted">${t.id} · ${fmtPhone(t.phone)} · ${esc(t.email)}</p><h3 style="margin:14px 0 8px;font-size:1rem">Application history</h3>${t.apps.map(a => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${esc(a.title)}</b><small class="muted" style="display:block">${a.id} · ${esc(locLabel(a.loc))}</small></span>${appBadge(a.status)}</div>`).join('')}<h3 style="margin:14px 0 8px;font-size:1rem">Skills (inferred)</h3><div class="tags">${t.skills.map(s => `<span class="tag">${esc(s)}</span>`).join('') || '—'}</div><p class="muted" style="margin-top:14px;font-size:.85rem">Future: automatic resume parsing will fill skills, location and industries.</p>`); },
  catNew() { ACT._catForm({ label: '', icon: '', group: 'other' }); },
  catEdit(el) { ACT._catForm(DB.d.categories.find(c => c.id === el.dataset.id)); },
  _catForm(c) { openModal(`<h2>${c.id ? 'Edit' : 'Add'} category</h2><form data-form="catsave" data-id="${c.id || ''}" novalidate><div class="frow">${fld('label', 'Name', inp('label', { val: c.label }))}${fld('icon', 'Emoji', inp('icon', { val: c.icon, max: 4 }))}</div>${fld('group', 'Shows under filter', sel('group', GROUPS.filter(g => !['all', 'urgent'].includes(g[0])), { blank: false, val: c.group }))}<button class="btn btn-primary" type="submit">Save</button></form>`); },
  catToggle(el) { const c = DB.d.categories.find(x => x.id === el.dataset.id); API.adminSaveCategory({ id: c.id, active: !c.active, label: c.label }); rerender(); },
  mView(el) { const m = DB.d.outbox.find(x => x.id === el.dataset.id); openModal(`<h2>${esc(m.subject)}</h2><p class="muted">To: ${esc(m.to)} · ${fmtDT(m.sentAt)}</p><pre class="mail">${esc(m.text)}</pre>${m.attachments?.length ? `<p class="muted" style="margin-top:8px">📎 ${esc(m.attachments[0].filename)} (${fmtSize(m.attachments[0].size)})</p>` : ''}`); },
  resetDemo() { askConfirm('Reset all demo data?', 'This restores the sample vendors, requirements and applications and removes anything you created.', 'Reset', () => { DB.reset(); Session.clear(); LS.del('mentry.myapps'); LS.del('mentry.saved'); location.hash = '#/'; location.reload(); }, true); }
};

const FORMS = {
  async apply(f) {
    const d = formData(f), btn = $('button[type=submit]', f), errs = {};
    const c = [['name', V.name(d.name)], ['phone', V.phone(d.phone)], ['email', V.email(d.email)], ['experience', V.req(d.experience, 'Select your experience.')], ['file', V.fileBasic(pendingFile)]];
    c.forEach(([k, m]) => m && (errs[k] = m)); if (!$('#f-confirm').checked) errs.confirm = 'Please confirm your details are correct.';
    if (Object.keys(errs).length) return showErrors(f, errs);
    showErrors(f, {}); setBusy(btn, true, 'Submitting…');
    try {
      const { id } = await API.submitApplication({ reqId: f.dataset.req, name: d.name, phone: d.phone, email: d.email, experience: d.experience, message: d.message, file: pendingFile, confirm: true, hp: d.hp, elapsed: Date.now() - formOpenedAt, source: f.dataset.src });
      LS.set('mentry.profile', { name: d.name, phone: d.phone, email: d.email, experience: d.experience }); MyApps.add(id); go('/application-success?id=' + id);
    } catch (e) { setBusy(btn, false); if (e.fields) showErrors(f, e.fields); else if (e.dupId) { toast(e.message, 'err'); } else toast(e.message, 'err'); }
  },
  async contact(f) { const d = formData(f), b = $('button[type=submit]', f); setBusy(b, true, 'Sending…'); try { await API.sendContact(d); f.reset(); showErrors(f, {}); toast('Message sent'); } catch (e) { e.fields ? showErrors(f, e.fields) : toast(e.message, 'err'); } setBusy(b, false); },
  status(f) { const id = formData(f).id.trim(); if (!id) return showErrors(f, { id: 'Enter your Application ID.' }); go('/application-status?id=' + encodeURIComponent(id)); },
  async vlogin(f) { const d = formData(f), b = $('button[type=submit]', f); if (!d.email || !d.password) return showErrors(f, { email: d.email ? '' : 'Enter your email.', password: d.password ? '' : 'Enter your password.' }); setBusy(b, true, 'Signing in…'); try { await API.login(d.email, d.password, 'vendor'); go(f.dataset.next || '/vendor/dashboard'); } catch (e) { setBusy(b, false); showErrors(f, { password: e.message }); } },
  async alogin(f) { const d = formData(f), b = $('button[type=submit]', f); setBusy(b, true, 'Signing in…'); try { await API.login(d.email, d.password, 'admin'); go('/admin/dashboard'); } catch (e) { setBusy(b, false); showErrors(f, { password: e.message }); } },
  async forgot(f) { const d = formData(f); if (V.email(d.email)) return showErrors(f, { email: V.email(d.email) }); await API.forgotPassword(d.email); closeModal(); toast('If that email is registered, a reset link is on its way'); },
  async vreg(f) {
    const d = formData(f), b = $('button[type=submit]', f), files = [...($('#f-docs').files || [])];
    if (files.some(x => x.size > MAX_FILE)) return showErrors(f, { docs: 'Each document must be under 8 MB.' });
    setBusy(b, true, 'Submitting…');
    try { d.docs = files.map(x => x.name); const v = await API.registerVendor(d); await Promise.all(files.map(x => Blobs.put(`vdoc/${v.id}/${x.name}`, x)));
      f.closest('.card').innerHTML = `<div class="tc" style="padding:24px 0"><div class="ring" style="width:80px;height:80px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px">${ic('check', 36)}</div><h1 style="font-size:1.7rem">Vendor verification request submitted</h1><p class="muted" style="margin:10px auto 18px;max-width:46ch">Status: <b>Pending verification</b>. Mentry will review ${esc(v.company)} and email you at ${esc(v.email)}. You can log in now — publishing unlocks after approval.</p><a class="btn btn-primary" href="#/vendor/login">Go to vendor login</a></div>`;
    } catch (e) { setBusy(b, false); e.fields ? showErrors(f, e.fields) : toast(e.message, 'err'); }
  },
  async postreq(f) {
    const d = formData(f), b = $('button[type=submit]', f); d.topics = splitList(d.topics); d.skills = splitList(d.skills);
    ['travel', 'food', 'stay'].forEach(k => d[k + 'Ok'] = f.elements[k + 'Ok'].checked); d.urgent = f.elements.urgent.checked;
    setBusy(b, true, 'Submitting…');
    try { const r = await API.vendorSaveRequirement(d, f.dataset.edit || null);
      $('#postcard').innerHTML = `<div class="pad tc" style="padding:40px 20px"><div class="ring" style="width:80px;height:80px;border-radius:50%;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center;margin:0 auto 14px">${ic('clock', 36)}</div><h2 style="font-size:1.6rem">Pending Mentry review</h2><p class="muted" style="margin:10px auto 18px;max-width:50ch"><b>${esc(r.title)}</b> is with the Mentry team. Once approved it goes live as <span class="badge open">🟢 Published</span> and we'll email you.</p><div class="row wrapx" style="justify-content:center"><a class="btn btn-primary" href="#/vendor/requirements">View requirements</a><a class="btn btn-outline" href="#/vendor/post-requirement">Post another</a></div></div>`; toast('Requirement submitted for review');
    } catch (e) { setBusy(b, false); e.fields ? showErrors(f, e.fields) : toast(e.message, 'err'); }
  },
  vprofile(f) { API.vendorUpdateProfile(formData(f)); toast('Profile saved'); },
  async pwd(f) { const d = formData(f); try { await API.changePassword(d.old, d.new); f.reset(); showErrors(f, {}); toast('Password updated'); } catch (e) { showErrors(f, { [/Current/.test(e.message) ? 'old' : 'new']: e.message }); } },
  async redit(f) { const d = formData(f); const dl = new Date(d.deadline + 'T00:00:00').getTime() + DAY - 60000; await API.adminSetRequirement(f.dataset.id, 'edit', { title: d.title, location: d.location, vacancies: +d.vacancies || 1, deadline: dl, urgent: f.elements.urgent.checked }); closeModal(); toast('Requirement updated'); rerender(); },
  catsave(f) { const d = formData(f); try { API.adminSaveCategory({ id: f.dataset.id || '', label: d.label, icon: d.icon, group: d.group }); closeModal(); toast('Category saved'); rerender(); } catch (e) { showErrors(f, { label: e.message }); } },
  settings(f) { const d = formData(f); API.adminSaveSettings({ adminEmail: d.adminEmail, whatsapp: d.whatsapp.replace(/\D/g, ''), baseUrl: d.baseUrl.trim(), stats: [0, 1, 2, 3].map(i => [d['sn' + i], d['sl' + i]]) }); toast('Settings saved'); }
};

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  const a = el.closest('a[href]'); const external = el.tagName === 'A' && el.getAttribute('href') && !el.getAttribute('href').startsWith('#');
  if (!external) e.preventDefault();
  try { await fn(el, e); } catch (err) { console.error(err); toast(err.message || 'Something went wrong', 'err'); }
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; fn && fn(f, e); });
const onQ = debounce(v => { F.q = v; F.page = 1; refreshFeed(); }, 250);
document.addEventListener('input', e => { if (e.target.dataset?.f === 'q') onQ(e.target.value); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-file') {
    const f = t.files[0], fieldEl = t.closest('.field'); const err = V.fileBasic(f);
    if (err) { pendingFile = null; t.value = ''; $('#filechip').innerHTML = ''; showErrors(t.closest('form'), { file: 'Your resume could not be uploaded. ' + err }); return; }
    pendingFile = f; showErrors(t.closest('form'), {}); $('#drop').classList.add('hide');
    $('#filechip').innerHTML = `<div class="filechip">${ic('file', 20)}<span>${esc(f.name)} · ${fmtSize(f.size)}</span><button type="button" class="btn btn-soft btn-sm" data-act="removeFile">Remove</button></div>`; return;
  }
  if (t.closest('#filters')) {
    const key = t.dataset.f || t.name || t.id.replace('f-', ''); F[key] = t.type === 'checkbox' ? t.checked : t.value; F.page = 1; refreshFeed();
  }
  if (t.dataset?.pref) { const p = LS.get('mentry.notifprefs', { app: true, status: true }); p[t.dataset.pref] = t.checked; LS.set('mentry.notifprefs', p); toast('Preference saved'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDrawer(); $('#filters')?.classList.remove('open'); } });

/* ---------- ROUTE REGISTRATION ORDER: specific routes before generic ---------- */
(async function boot() {
  try { await DB.init(); } catch (e) { console.error(e); document.body.innerHTML = '<p style="padding:40px">Storage is unavailable in this browser. Please enable it and reload.</p>'; return; }
  $('#boot')?.remove();
  render();
})();


</script>
